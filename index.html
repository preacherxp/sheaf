<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing leaves the browser except calls to GitHub's own API and avatar CDN. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://avatars.githubusercontent.com; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>sheaf</title>
<meta name="description" content="One link for the same pull request across many repositories, with who has seen each one.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="sheaf, new bundle"><img src="mark.svg" alt="" width="28" height="28"><span class="word">sheaf</span></a>
  <span class="tag">pull requests, bundled</span>
  <span id="who" class="who"></span>
</header>
<main id="app"></main>
<footer class="foot">Runs in your browser. Talks only to api.github.com. <a href="https://github.com/preacherxp/sheaf">Source</a></footer>
<noscript><p class="wrap">sheaf needs JavaScript.</p></noscript>
</body>
</html>
